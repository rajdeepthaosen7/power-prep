# Used only on AWS Lambda (see lambda/StreamLambdaHandler)
# Start everything up front: with SnapStart the start-up cost is paid once, at deploy time
spring.main.lazy-initialization=false
# One request at a time per Lambda instance
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
# Keep CloudWatch logs small (free allowance 5 GB/month)
logging.level.root=WARN
logging.level.com.rajdeep=INFO
logging.level.org.flywaydb=INFO
