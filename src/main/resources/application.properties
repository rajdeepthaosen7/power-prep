spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
# Neon: set DATABASE_URL like jdbc:postgresql://HOST/DB?sslmode=require plus DB_USER and DB_PASSWORD on Render
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/powerprep}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.flyway.enabled=true
spring.main.lazy-initialization=true
spring.jmx.enabled=false
management.endpoints.web.exposure.include=health
management.health.db.enabled=false
# ---- auth ----
app.auth.google-client-id=${GOOGLE_CLIENT_ID:}
app.auth.google-jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
app.auth.admin-email=${ADMIN_EMAIL:}
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.token-days=30
# content APIs need an approved account (switched on together with the new UI)
app.auth.content-requires-approval=${CONTENT_REQUIRES_APPROVAL:false}

# Gzip JSON (chapter pages carry notes and SVG figures; they shrink ~5x)
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=2048
