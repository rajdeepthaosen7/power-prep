# Builds the Lambda zip and deploys it to AWS on every push to main (Render keeps deploying too, until it is retired).
name: Deploy API to AWS Lambda
on:
  push:
    branches: [main]
    paths: ["src/**", "pom.xml", "deploy/aws/**", ".github/workflows/deploy-lambda.yml"]
  workflow_dispatch:
permissions:
  id-token: write   # GitHub OIDC -> AWS role, no AWS keys stored in GitHub
  contents: read
concurrency:
  group: deploy-lambda
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCOUNT_ID: "189352553185"   # not a secret; access is limited by the OIDC role trust (main branch of this repo)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Build Lambda zip
        run: mvn -B -q -DskipTests -Plambda package
      - name: Show OIDC claims (no secrets; helps fix the AWS trust policy)
        run: |
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$T" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss,aud,sub}' || true
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_ACCOUNT_ID != '000000000000'
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/power-prep-deploy
          aws-region: ap-southeast-2
      - name: Deploy
        if: env.AWS_ACCOUNT_ID != '000000000000'
        run: bash deploy/aws/deploy.sh
