# Power Systems Chapter 1 PYQs, part 2: thermal, hydro, nuclear and renewable plants.
# Exam questions keep their original wording. "status": OFFICIAL_KEY | TWO_SOURCES | UNVERIFIED (solved by us).

# ---------------- thermal ----------------

- key: gate-2004-feed-pump
  topic: ps1-thermal-plants
  sources: [{code: GATE-2004, q: "~working-fluid-pressure", marks: 1, url: "https://questions.examside.com/past-years/gate/question/in-thermal-power-plants-the-pressure-in-the-working-fluid-cy-gate-ee-2004-marks-1-maitqbpg6b1ftxs5.htm"}]
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: UNVERIFIED
  stem: |
    In thermal power plants, the pressure in the working fluid cycle is developed by
  options:
    - {label: A, md: "Condenser"}
    - {label: B, md: "Super heater"}
    - {label: C, md: "Feed water pump", correct: true}
    - {label: D, md: "Turbine"}
  solution: |
    **Idea used:** the job of each part of the Rankine cycle — see *Steam (thermal) power plants → The water–steam cycle*.

    - The **feed pump** pushes the condensed water into the boiler at the high boiler pressure: it develops the pressure of the cycle.
    - The boiler and superheater add heat at (nearly) constant pressure; they do not create the pressure.
    - The turbine *uses* the pressure (the steam expands and its pressure falls).
    - The condenser works at the lowest pressure (vacuum).

    **Answer: (C) Feed water pump.**

- key: gate-2000-economiser
  topic: ps1-thermal-plants
  sources: [{code: GATE-2000, q: "~economiser", marks: 1, url: "https://questions.examside.com/past-years/gate/question/in-a-thermal-power-plant-the-feed-water-coming-to-the-econom-gate-ee-2000-marks-1-70l3mam1aebrsn2r.htm"}]
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: UNVERIFIED
  stem: |
    In a thermal power plant, the feed water coming to the economiser is heated using
  options:
    - {label: A, md: "H.P steam"}
    - {label: B, md: "L.P steam"}
    - {label: C, md: "Direct heat in the furnace"}
    - {label: D, md: "Flue gases.", correct: true}
  solution: |
    **Idea used:** the economiser — see *Steam (thermal) power plants → Economiser*.

    The economiser is placed in the path of the hot **flue gases** after the boiler and superheater. It uses heat that would otherwise go up the chimney to warm the feed water, which saves fuel.

    (Feed-water heaters that use steam bled from the turbine also exist, but they are separate heaters, not the economiser.)

    **Answer: (D) Flue gases.**

- key: aegcl-2023-42
  topic: ps1-thermal-plants
  sources: [{code: AEGCL-2023, q: "42", marks: 1}]
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: UNVERIFIED
  stem: |
    In coal-fired thermal power station, what are the electrostatic precipitators used for?
  options:
    - {label: A, md: "To remove dust particles setting on the busbar conductors in the station switchyard"}
    - {label: B, md: "To condense steam by electrostatic means"}
    - {label: C, md: "To keep the air heaters clean"}
    - {label: D, md: "To collect the dust particles from the flue gases", correct: true}
  solution: |
    **Idea used:** the electrostatic precipitator — see *Steam (thermal) power plants → Electrostatic precipitator (ESP)*.

    The flue gases of a coal plant carry fine ash (fly ash). The ESP charges these particles and collects them on charged plates, so that clean gas goes up the chimney.

    **Answer: (D).**

- key: ese-2020-121
  topic: ps1-thermal-plants
  sources: [{code: ESE-2020, q: "121", marks: 2}]
  type: MCQ
  nature: THEORY
  difficulty: 2
  status: UNVERIFIED
  stem: |
    Which of the following statements regarding steam boilers are correct?

    1. The boiler must be capable of quick starting and loading.
    2. The boiler should have no joints exposed to flames.
    3. The boiler must be capable of burning low ash content coal efficiently.
  options:
    - {label: A, md: "1 and 2 only"}
    - {label: B, md: "1 and 3 only"}
    - {label: C, md: "2 and 3 only"}
    - {label: D, md: "1, 2 and 3", correct: true}
  solution: |
    **Idea used:** the requirements of a good boiler — see *Steam (thermal) power plants → Boiler*.

    1. Quick starting and loading lets the boiler follow changes of load. **Required.**
    2. Joints in the direct flame get overheated and weaken. **Required: no joints exposed to flames.**
    3. The boiler must burn its fuel efficiently (complete combustion, maximum steam per kg of fuel). This statement is taken from the same textbook list of requirements.

    **Answer: (D) 1, 2 and 3** (the answer given in the commonly used keys; no official key in hand).

- key: ese-2024-113
  topic: ps1-thermal-plants
  sources: [{code: ESE-2024, q: "113", marks: 2}]
  type: MCQ
  nature: THEORY
  difficulty: 3
  status: UNVERIFIED
  stem: |
    Which one of the following statements is correct regarding superheaters in steam power plants?
  options:
    - {label: A, md: "In modern utility high-pressure boilers, more than 40% of the total heat absorbed in the generation of steam takes place in the superheaters.", correct: true}
    - {label: B, md: "In modern utility high-pressure boilers, less than 40% of the total heat absorbed in the generation of steam takes place in the superheaters."}
    - {label: C, md: "In modern utility high-pressure boilers, less than 20% of the total heat absorbed in the generation of steam takes place in the superheaters."}
    - {label: D, md: "In modern utility high-pressure boilers, less than 30% of the total heat absorbed in the generation of steam takes place in the superheaters."}
  solution: |
    **Idea used:** why superheating takes a big share of the heat at high pressure — see *Steam (thermal) power plants → Superheater*.

    Heat given to water in a boiler goes into three jobs: warming the water, boiling it (latent heat) and superheating the steam. As the pressure rises, the **latent heat becomes smaller** (it is zero at the critical point). Modern utility boilers work at very high pressure and very high final steam temperature, so the **superheating share becomes large: more than 40 %** of the total heat.

    **Option logic:** (B), (C) and (D) all say "less than …", and (C) and (D) are already inside (B). If any of them were true, (B) would be true too, giving more than one correct answer. Only (A) stands alone.

    **Answer: (A).**

- key: ese-2025-123
  topic: ps1-thermal-plants
  sources: [{code: ESE-2025, q: "123", marks: 2}]
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: UNVERIFIED
  stem: |
    A steam power station of 100 MW capacity uses coal of calorific value of 6400 kcal/kg. The thermal efficiency of the station is 30% and electrical generation efficiency is 92%. When the station is working at full load, the coal required per hour will be nearly
  options:
    - {label: A, md: "38·3 tonnes"}
    - {label: B, md: "48·7 tonnes", correct: true}
    - {label: C, md: "54·7 tonnes"}
    - {label: D, md: "64·3 tonnes"}
  solution: |
    **Idea used:** coal per hour $= P\times860/(\eta_{overall}\times CV)$ — see *Steam (thermal) power plants → Efficiency, heat rate and coal consumption* (Example 1).

    - Overall efficiency $= 0.30\times0.92 = 0.276$.
    - Electrical energy in one hour $= 100\,000$ kWh $= 100\,000\times860 = 8.6\times10^7$ kcal.
    - Heat needed from coal $= 8.6\times10^7/0.276 \approx 3.116\times10^8$ kcal.
    - Coal $= 3.116\times10^8/6400 \approx 48\,690$ kg $\approx 48.7$ tonnes.

    **Without a calculator:** $860/6400 = 0.134$; so coal $= \dfrac{100\,000\times0.134}{0.276}$ kg. Now $0.134/0.276 \approx 0.49$ (since $0.276\times0.5 = 0.138$, a little more than 0.134). So about $0.487\times100\,000 \approx 48\,700$ kg.

    **Trap:** using only the thermal efficiency (0.30) gives $8.6\times10^7/(0.30\times6400) = 44.8$ t, which is not an option. Always divide by the **overall** efficiency (thermal × generator); the generator loses a little more, so more coal is needed, not less.

    **Answer: (B) 48.7 tonnes.**

- key: ese-2025-125
  topic: ps1-thermal-plants
  sources: [{code: ESE-2025, q: "125", marks: 2}]
  type: MCQ
  nature: THEORY
  difficulty: 2
  status: UNVERIFIED
  stem: |
    The advantages of supercritical steam power plants are

    1. low grade fossil fuels can be used
    2. NOx emissions are completely eliminated
    3. SOx emissions are reduced and complete burning of coal occurs

    Which of the above advantages are correct?
  options:
    - {label: A, md: "1 and 2 only"}
    - {label: B, md: "1 and 3 only", correct: true}
    - {label: C, md: "2 and 3 only"}
    - {label: D, md: "1, 2 and 3"}
  solution: |
    **Idea used:** supercritical plants — see *Steam (thermal) power plants → Supercritical plants*.

    - Statement 2 says NOx is **completely eliminated**. A supercritical plant burns less coal per kWh, so it emits **less** NOx, but never zero. **False.** This removes (A), (C) and (D).
    - Statements 1 and 3 are the listed advantages: low-grade coal can be used, more complete burning, lower SOx per unit.

    **Answer: (B) 1 and 3 only.**

# ---------------- hydro ----------------

- key: aegcl-2023-27
  topic: ps1-hydro-plants
  sources: [{code: AEGCL-2023, q: "27", marks: 1}]
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: UNVERIFIED
  stem: |
    The output from a hydroelectric power plant depends on
  options:
    - {label: A, md: "head, type of dam and discharge"}
    - {label: B, md: "type of catchment area, dam and discharge"}
    - {label: C, md: "type of draft tube, turbine and efficiency of the system"}
    - {label: D, md: "head, discharge and efficiency of the system", correct: true}
  solution: |
    **Idea used:** $P = 9.81\,Q\,H\,\eta$ kW — see *Hydroelectric power plants → How much power?*

    The formula has exactly three variables: the **head** $H$, the **discharge** $Q$ and the **efficiency** $\eta$. The type of dam, catchment or draft tube does not appear.

    **Asked before:** the same question, with the same options, was asked in UPSC ESE Electrical 2015 (objective Paper II).

    **Answer: (D).**

- key: ese-2024-125
  topic: ps1-hydro-plants
  sources: [{code: ESE-2024, q: "125", marks: 2}]
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: UNVERIFIED
  stem: |
    A large hydropower station has a head of 324 m and an average flow of 1370 m³/s. The reservoir of water behind the dams and dikes is composed of series of lakes covering an area of 6400 km². What is the available hydraulic power?
  options:
    - {label: A, md: "4350 kW"}
    - {label: B, md: "4350 MW", correct: true}
    - {label: C, md: "435 MW"}
    - {label: D, md: "435 kW"}
  solution: |
    **Idea used:** $P = \rho g Q H$ — see *Hydroelectric power plants → How much power?* (and the trap about the reservoir area).

    $$P = 1000\times9.81\times1370\times324\ \text{W}$$

    **Without a calculator:** take $g = 10$: $10\times1370\times324 = 4\,438\,800$ kW $\approx 4440$ MW. Reduce by 2 % (for 9.81): about 4350 MW. The options differ by factors of 10 and 1000, so only the size matters: **4350 MW**.

    The lake area (6400 km²) is extra data; hydraulic power needs only flow and head.

    **Answer: (B) 4350 MW.**

- key: apdcl-2023-81
  topic: ps1-hydro-plants
  sources: [{code: APDCL-2023, q: "81", marks: 1.5}]
  type: MCQ
  nature: THEORY
  difficulty: 2
  status: UNVERIFIED
  stem: |
    A hydel power plant of run-off-river type should be provided with a pondage so that the
  options:
    - {label: A, md: "firm capacity of the plant is increased", correct: true}
    - {label: B, md: "operating head is controlled"}
    - {label: C, md: "pressure inside the turbine casing remains constant"}
    - {label: D, md: "kinetic energy of the running water is fully utilized"}
  solution: |
    **Idea used:** run-of-river plants with pondage, and firm capacity — see *Hydroelectric power plants → By the storage of water*.

    Without pondage, the plant can give only what the river brings at that moment, so its dependable output (firm capacity) is set by the lowest flow. A pond stores water during low-load hours and releases it during peak hours, so the power the plant can **always** supply goes up: the **firm capacity increases**.

    **Answer: (A).**

- key: apgcl-2023-47
  topic: ps1-hydro-plants
  sources:
    - {code: APGCL-2023, q: "47", marks: 1.5, primary: true}
    - {code: GATE-2004, q: "~kaplan", marks: 1, url: "https://questions.examside.com/past-years/gate/gate-ee/power-system-analysis/generating-power-station/marks-1"}
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: UNVERIFIED
  stem: |
    For harnessing low variable water heads, the suitable hydraulic turbine with high percentage of reaction and runner adjustable vanes is
  options:
    - {label: A, md: "Kaplan", correct: true}
    - {label: B, md: "Francis"}
    - {label: C, md: "Pelton"}
    - {label: D, md: "Impeller"}
  solution: |
    **Idea used:** the Kaplan turbine — see *Hydroelectric power plants → Kaplan turbine*.

    Every clue points to Kaplan: **low head**, head that **varies**, **high degree of reaction** (axial-flow reaction turbine) and **adjustable runner blades** (vanes). Francis suits medium heads and has fixed runner blades; Pelton is an impulse turbine for high heads; an impeller is the rotating part of a pump.

    *Note:* APGCL 2023 Q47 is word-for-word GATE EE 2004 (1 mark). APSC does pick GATE questions.

    **Answer: (A) Kaplan.**

- key: ese-2019-146
  topic: ps1-hydro-plants
  sources: [{code: ESE-2019, q: "146", marks: 2}]
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: UNVERIFIED
  stem: |
    **Statement (I):** Reaction turbines are generally used for sites with high head and low flow.

    **Statement (II):** Kaplan and Francis turbines are reaction turbines.
  options:
    - {label: A, md: "Both Statement (I) and Statement (II) are individually true and Statement (II) is the correct explanation of Statement (I)"}
    - {label: B, md: "Both Statement (I) and Statement (II) are individually true but Statement (II) is NOT the correct explanation of Statement (I)"}
    - {label: C, md: "Statement (I) is true but Statement (II) is false"}
    - {label: D, md: "Statement (I) is false but Statement (II) is true", correct: true}
  solution: |
    **Idea used:** impulse and reaction turbines — see *Hydroelectric power plants → Impulse and reaction turbines* (and the trap there).

    - **Statement (I):** high head and low flow is the field of the **Pelton** (impulse) turbine. Reaction turbines are used for medium and low heads with large flows. **False.**
    - **Statement (II):** Kaplan and Francis runners work fully immersed in water and are driven by the pressure drop across them: both are reaction turbines. **True.**

    **Answer: (D).**

- key: ese-2023-108
  topic: ps1-hydro-plants
  sources: [{code: ESE-2023, q: "108", marks: 2}]
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: UNVERIFIED
  stem: |
    Which type of hydro turbine is totally embedded in the fluid and powered from the pressure drop across the device?
  options:
    - {label: A, md: "Impulse turbine only"}
    - {label: B, md: "Reaction turbine only", correct: true}
    - {label: C, md: "Squirrel cage turbine only"}
    - {label: D, md: "Both impulse turbine and reaction turbine"}
  solution: |
    **Idea used:** reaction turbines — see *Hydroelectric power plants → Impulse and reaction turbines*.

    A reaction turbine's runner is completely filled with water in a closed casing and is driven by the drop of pressure across it. An impulse turbine (Pelton) is driven by a free jet in open air at atmospheric pressure, so its runner is not embedded in the water and there is no pressure drop across it. "Squirrel cage" is an induction-motor rotor, not a turbine.

    **Answer: (B) Reaction turbine only.**

- key: ese-2025-122
  topic: ps1-hydro-plants
  sources: [{code: ESE-2025, q: "122", marks: 2}]
  type: MCQ
  nature: THEORY
  difficulty: 2
  status: UNVERIFIED
  stem: |
    The specific rotational speed ($N_s$) for a water turbine is

    where, $P_t$ is output in metric hp, $N$ is actual rotational speed of the turbine and $H$ is effective head in metres.
  options:
    - {label: A, md: "$\\dfrac{N\\sqrt{P_t}}{H^{2.25}}$"}
    - {label: B, md: "$\\dfrac{P_t\\sqrt{N}}{H^{1.25}}$"}
    - {label: C, md: "$\\dfrac{N\\sqrt{P_t}}{H^{1.25}}$", correct: true}
    - {label: D, md: "$\\dfrac{P_t\\sqrt{N}}{H^{2.25}}$"}
  solution: |
    **Idea used:** $N_s = N\sqrt P/H^{5/4}$ — see *Hydroelectric power plants → Specific speed*.

    The speed $N$ appears directly (not under a root), the power under a square root, and the head to the power $5/4 = 1.25$ in the denominator.

    **Memory check:** specific speed is "a speed", so $N$ itself must be in the numerator, not $\sqrt N$. That removes (B) and (D). Between $H^{1.25}$ and $H^{2.25}$, the correct power is $5/4 = 1.25$.

    **Answer: (C).**

# ---------------- nuclear ----------------

- key: gate-1996-boron
  topic: ps1-nuclear-gas-diesel
  sources: [{code: GATE-1996, q: "~control-rods", marks: 1, url: "https://questions.examside.com/past-years/gate/question/which-material-is-used-in-controlling-chain-reaction-in-a-nu-gate-ee-1996-marks-1-jh4u11d1cbcpv6r4.htm"}]
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: UNVERIFIED
  stem: |
    Which material is used in controlling chain reaction in a nuclear reactor?
  options:
    - {label: A, md: "Thorium"}
    - {label: B, md: "Heavy water"}
    - {label: C, md: "Boron", correct: true}
    - {label: D, md: "Beryllium"}
  solution: |
    **Idea used:** the parts of a reactor — see *Nuclear, gas turbine and diesel plants → Parts of a nuclear reactor*.

    The chain reaction is controlled by **control rods** that absorb neutrons. They are made of **boron** (or cadmium, hafnium).

    - Thorium is a (fertile) fuel.
    - Heavy water is a moderator (and coolant): it slows neutrons, it does not absorb them.
    - Beryllium is a moderator/reflector.

    **Answer: (C) Boron.**

