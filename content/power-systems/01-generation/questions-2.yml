- key: ese-2022-96
  topic: ps1-renewables
  sources: [{code: ESE-2022, q: "96", marks: 2}]
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: UNVERIFIED
  stem: |
    Which one of the following is not an example of renewable energy?
  options:
    - {label: A, md: "Solar"}
    - {label: B, md: "Wind"}
    - {label: C, md: "Geothermal"}
    - {label: D, md: "Nuclear", correct: true}
  solution: |
    **Idea used:** renewable and non-renewable sources — see *Solar, wind and other renewables → Renewable and non-renewable sources*.

    Nuclear fuel (uranium) is a limited mineral stock; it is low-carbon but **not renewable**. Solar, wind and geothermal are refilled by nature.

    **Answer: (D) Nuclear.**

- key: ese-2021-106
  topic: ps1-renewables
  sources: [{code: ESE-2021, q: "106", marks: 2}]
  type: MCQ
  nature: THEORY
  difficulty: 2
  status: UNVERIFIED
  stem: |
    Which one of the following power plants is the least reliable?
  options:
    - {label: A, md: "Tidal"}
    - {label: B, md: "Solar"}
    - {label: C, md: "Wind", correct: true}
    - {label: D, md: "Geothermal"}
  solution: |
    **Idea used:** reliability of renewable sources — see *Solar, wind and other renewables → Reliability of renewable sources*.

    - Geothermal runs steadily all the time: most reliable.
    - Tides follow the moon and can be predicted years ahead.
    - Solar output follows the known day–night cycle (clouds add some uncertainty).
    - **Wind** changes from minute to minute and may stop for days; it is the hardest to predict.

    **Answer: (C) Wind.**

- key: ese-2020-130
  topic: ps1-renewables
  sources: [{code: ESE-2020, q: "130", marks: 2}]
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: UNVERIFIED
  stem: |
    In a photovoltaic system, there is a thermally generated small reverse saturation current which flows even in the absence of light, called
  options:
    - {label: A, md: "Photon current"}
    - {label: B, md: "Diode current"}
    - {label: C, md: "Leakage current"}
    - {label: D, md: "Dark current", correct: true}
  solution: |
    **Idea used:** the equivalent circuit of a solar cell — see *Solar, wind and other renewables → The equivalent circuit*.

    The reverse saturation current $I_0$ of the cell's p-n junction is produced by heat, not by light, so it flows even in the dark. It is called the **dark current**. The photon (light-generated) current is the one that needs light.

    **Answer: (D) Dark current.**

- key: ese-2021-103
  topic: ps1-renewables
  sources: [{code: ESE-2021, q: "103", marks: 2}]
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: UNVERIFIED
  stem: |
    The fill factor of a photovoltaic module is 0·8. A single cell in a module has an open circuit voltage of 0·6 V and short circuit current of 8 A. The module has 48 cells connected in series. If the voltage at maximum power is 0·9 times open circuit voltage, the current at maximum power is
  options:
    - {label: A, md: "8·21 A"}
    - {label: B, md: "7·11 A", correct: true}
    - {label: C, md: "6·32 A"}
    - {label: D, md: "5·45 A"}
  solution: |
    **Idea used:** fill factor $FF = V_{mp}I_{mp}/(V_{oc}I_{sc})$ and cells in series — see *Solar, wind and other renewables → The I-V curve and the key numbers* (Example 1).

    - Module: $V_{oc} = 48\times0.6 = 28.8$ V; $I_{sc} = 8$ A (series cells carry the same current).
    - $V_{mp} = 0.9\times28.8 = 25.92$ V.

    $$I_{mp} = \frac{FF\,V_{oc}I_{sc}}{V_{mp}} = \frac{0.8\times28.8\times8}{25.92} = 7.11\ \text{A}$$

    **Without a calculator:** $V_{oc}/V_{mp} = 1/0.9$, so $I_{mp} = I_{sc}\times\dfrac{0.8}{0.9} = 8\times\dfrac89 = \dfrac{64}{9} = 7.11$ A. The 48 cells and 0.6 V cancel out completely.

    **Check:** $I_{mp}$ must be less than $I_{sc} = 8$ A, which removes (A).

    **Answer: (B) 7.11 A.**

- key: ese-2021-104
  topic: ps1-renewables
  sources: [{code: ESE-2021, q: "104", marks: 2}]
  type: MCQ
  nature: THEORY
  difficulty: 2
  status: UNVERIFIED
  stem: |
    The equivalent circuit of a photovoltaic module is presented below:

    ![PV module equivalent circuit (redrawn in the standard form): light current source, diode, shunt resistance Rsh and series resistance Rs](fig:q-ese2021-104)

    The requirements for more power production are
  options:
    - {label: A, md: "$I_L$ should be maximum, $R_s$ should be large, $R_{sh}$ should be small"}
    - {label: B, md: "$I_L$ should be minimum, $R_s$ should be small, $R_{sh}$ should be large"}
    - {label: C, md: "$I_L$ should be maximum, $R_s$ should be small, $R_{sh}$ should be large", correct: true}
    - {label: D, md: "$I_L$ should be minimum, $R_s$ should be large, $R_{sh}$ should be small"}
  solution: |
    **Idea used:** what each element of the PV model does — see *Solar, wind and other renewables → The equivalent circuit*.

    - $I_L$ is the current made by light: **more is better** → removes (B) and (D).
    - $R_s$ is in series with the output: the load current flows through it and loses voltage and power → it should be **small**.
    - $R_{sh}$ is a leakage path across the cell: a small $R_{sh}$ would steal current from the load → it should be **large**.

    An ideal cell has $R_s = 0$ and $R_{sh} = \infty$.

    **Answer: (C).**

- key: ese-2017-150
  topic: ps1-renewables
  sources: [{code: ESE-2017, q: "150", marks: 2}]
  type: MCQ
  nature: THEORY
  difficulty: 2
  status: UNVERIFIED
  stem: |
    **Statement (I):** The power available from wind is directly proportional to $V^3$ where $V$ is the velocity.

    **Statement (II):** Drag type wind turbines have lower speeds and high torque capabilities.
  options:
    - {label: A, md: "Both Statement (I) and Statement (II) are individually true and Statement (II) is the correct explanation of Statement (I)"}
    - {label: B, md: "Both Statement (I) and Statement (II) are individually true but Statement (II) is NOT the correct explanation of Statement (I)", correct: true}
    - {label: C, md: "Statement (I) is true but Statement (II) is false"}
    - {label: D, md: "Statement (I) is false but Statement (II) is true"}
  solution: |
    **Idea used:** power in the wind and the two kinds of wind turbine — see *Solar, wind and other renewables → Wind power*.

    - **Statement (I):** $P = \tfrac12\rho AV^3$, so $P \propto V^3$. **True.**
    - **Statement (II):** in a drag-type rotor (Savonius, water-pumping windmill) the wind just pushes the blades, so the blades cannot move faster than the wind: **low speed, high torque**. **True.**
    - **Is (II) the reason for (I)?** No. $P\propto V^3$ comes from the kinetic energy of the moving air ($\tfrac12 V^2$ per kg) times the mass flow ($\rho AV$ per second); it has nothing to do with the turbine type.

    **Answer: (B).**

- key: ese-2020-132
  topic: ps1-renewables
  sources: [{code: ESE-2020, q: "132", marks: 2}]
  type: MCQ
  nature: THEORY
  difficulty: 2
  status: UNVERIFIED
  stem: |
    In wind power, the speed which is considered as the single most important parameter is
  options:
    - {label: A, md: "Wind speed"}
    - {label: B, md: "Peripheral speed"}
    - {label: C, md: "Tip speed", correct: true}
    - {label: D, md: "Blade speed"}
  solution: |
    **Idea used:** tip speed ratio — see *Solar, wind and other renewables → Tip speed ratio*.

    In wind-turbine design, the **tip speed** (the tip speed ratio $\lambda = \omega R/V$ = speed of the blade tip ÷ wind speed) is treated as the single most important parameter: the power coefficient of a rotor depends on it, and the rotor is designed and controlled to work at its best tip speed ratio.

    **Careful:** the wind speed decides how much power is *available* (it goes as $V^3$), so (A) is tempting. But the question asks for the design parameter "considered as the single most important", which in the wind-energy textbooks is the tip speed. The keys in common use give (C).

    **Answer: (C) Tip speed.**
