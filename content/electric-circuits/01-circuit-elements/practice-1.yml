# Our own APSC-style questions for the Chapter 1 FRESH mock (Mock 2).
# Rules: 4-option MCQ, one correct, numbers that work by hand, short APSC-like wording.
# These never appear in Study or PYQ; they are shown only inside mock tests.
# status REVIEWED = answer worked twice by us (no exam key exists for our own questions).

# ---------- charge, current and voltage ----------
- key: ec1-p-001
  topic: ec1-charge-current-voltage
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: REVIEWED
  stem: |
    A circuit can be analysed with lumped elements (KCL and KVL) only when
  options:
    - {label: A, md: "all its elements are linear"}
    - {label: B, md: "the supply is DC"}
    - {label: C, md: "its physical size is very small compared with the wavelength of the signals", correct: true}
    - {label: D, md: "it has no energy-storing elements"}
  solution: |
    **Idea used:** the lumped element model (see *Charge, current and voltage → Lumped elements*).

    The lumped model treats each element as sitting at one point and the wires as perfect. This holds when the circuit is electrically small, that is, much smaller than the wavelength $\lambda = c/f$. At 50 Hz, $\lambda = 6000$ km, so almost every circuit is "small". Linearity, DC or the absence of L and C have nothing to do with it: KCL and KVL work for non-linear, AC and RLC circuits too.

    **Answer: (C).**

- key: ec1-p-002
  topic: ec1-charge-current-voltage
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    A steady current of 4 mA flows through a wire for 5 minutes. The charge that passes any cross-section of the wire is
  options:
    - {label: A, md: "0.02 C"}
    - {label: B, md: "1.2 C", correct: true}
    - {label: C, md: "20 C"}
    - {label: D, md: "1200 C"}
  solution: |
    **Idea used:** for a constant current, $q = I\,t$ (see *Charge, current and voltage → Current*).

    $t = 5$ min $= 300$ s. $q = 4\times10^{-3}\times300 = 1.2$ C.

    Trap: using $t = 5$ (minutes, not seconds) gives 0.02 C.

    **Without a calculator:** $4 \times 300 = 1200$ mC $= 1.2$ C.

    **Answer: (B) 1.2 C.**

- key: ec1-p-003
  topic: ec1-charge-current-voltage
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    A current of 1.6 mA flows in a conductor. Taking the electron charge as $1.6\times10^{-19}$ C, the number of electrons passing a point every second is about
  options:
    - {label: A, md: "$10^{16}$", correct: true}
    - {label: B, md: "$10^{19}$"}
    - {label: C, md: "$10^{22}$"}
    - {label: D, md: "$10^{13}$"}
  solution: |
    **Idea used:** current is charge per second; $n = \dfrac{I}{e}$ electrons per second.

    $n = \dfrac{1.6\times10^{-3}}{1.6\times10^{-19}} = 10^{-3+19} = 10^{16}$ per second.

    **Without a calculator:** the 1.6 cancels; only the powers of ten remain: $-3 - (-19) = 16$.

    **Answer: (A) $10^{16}$.**

- key: ec1-p-004
  topic: ec1-charge-current-voltage
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: REVIEWED
  stem: |
    In a metal wire, the conventional current flows
  options:
    - {label: A, md: "in the same direction as the electrons move"}
    - {label: B, md: "opposite to the direction in which the electrons move", correct: true}
    - {label: C, md: "at right angles to the motion of the electrons"}
    - {label: D, md: "in the direction of electron motion for AC only"}
  solution: |
    **Idea used:** direction of current (see *Charge, current and voltage → Direction of current*).

    By agreement, current is the direction in which **positive** charge would move. In a metal the moving charges are electrons (negative), so they move opposite to the conventional current. This is true for DC and AC alike.

    **Answer: (B).**

- key: ec1-p-005
  topic: ec1-charge-current-voltage
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    60 J of work is done in moving a charge of 5 C from point A to point B. The potential difference between A and B is
  options:
    - {label: A, md: "0.083 V"}
    - {label: B, md: "5 V"}
    - {label: C, md: "12 V", correct: true}
    - {label: D, md: "300 V"}
  solution: |
    **Idea used:** voltage is energy per unit charge, $V = \dfrac{W}{q}$ (see *Charge, current and voltage → Voltage*).

    $V = \dfrac{60}{5} = 12$ V.

    Traps: $q/W = 0.083$ (upside down) and $W\times q = 300$.

    **Without a calculator:** $60 \div 5 = 12$. Unit check: J/C = V.

    **Answer: (C) 12 V.**

- key: ec1-p-006
  topic: ec1-charge-current-voltage
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    The charge entering a terminal of an element is $q(t) = 5t^2 - 2t$ mC, with $t$ in seconds. The current into the terminal at $t = 1$ s is
  options:
    - {label: A, md: "8 mA", correct: true}
    - {label: B, md: "3 mA"}
    - {label: C, md: "10 mA"}
    - {label: D, md: "13 mA"}
  solution: |
    **Idea used:** $i = \dfrac{dq}{dt}$ (see *Charge, current and voltage → Current*).

    $i(t) = \dfrac{d}{dt}(5t^2 - 2t) = 10t - 2$ mA. At $t = 1$ s: $i = 10 - 2 = 8$ mA.

    Trap: putting $t = 1$ into $q(t)$ itself gives 3, which is the charge (3 mC), not the current.

    **Without a calculator:** differentiate term by term: $5t^2 \to 10t$, $2t \to 2$.

    **Answer: (A) 8 mA.**

# ---------- power and energy ----------
- key: ec1-p-007
  topic: ec1-power-energy
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    A 230 V room heater draws 4 A. The energy it uses in 2 hours is
  options:
    - {label: A, md: "0.46 kWh"}
    - {label: B, md: "0.92 kWh"}
    - {label: C, md: "1.84 kWh", correct: true}
    - {label: D, md: "3.68 kWh"}
  solution: |
    **Idea used:** $P = VI$ and $W = P\,t$ (see *Power and energy*).

    $P = 230\times4 = 920$ W $= 0.92$ kW. $W = 0.92\times2 = 1.84$ kWh.

    Trap: 0.92 kWh is the energy in one hour only.

    **Without a calculator:** $230\times4 = 920$; doubling gives 1840 Wh $= 1.84$ kWh.

    **Answer: (C) 1.84 kWh.**

- key: ec1-p-008
  topic: ec1-power-energy
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    The voltage across an element is 10 V, with terminal P at the higher potential. A current of 3 A **enters** the element at its other terminal Q (the lower-potential terminal). The element
  options:
    - {label: A, md: "absorbs 30 W"}
    - {label: B, md: "absorbs 13 W"}
    - {label: C, md: "delivers 13 W"}
    - {label: D, md: "delivers 30 W", correct: true}
  solution: |
    **Idea used:** passive sign convention: if the current enters the **+** terminal, absorbed power $= +vi$; if it enters the **−** terminal, absorbed power $= -vi$ (see *Power and energy → The passive sign convention*).

    P is +, Q is −. The current enters at Q, the − terminal. So absorbed power $= -(10)(3) = -30$ W, which means the element **delivers** 30 W. (It acts like a source: current leaves its + terminal.)

    Trap: 13 W comes from adding 10 and 3; power is a product.

    **Without a calculator:** $10\times3 = 30$; only the sign needs thought.

    **Answer: (D) delivers 30 W.**

- key: ec1-p-009
  topic: ec1-power-energy
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    A circuit has exactly four elements. Element 1 delivers 50 W, element 2 absorbs 30 W and element 3 absorbs 12 W. Element 4
  options:
    - {label: A, md: "delivers 8 W"}
    - {label: B, md: "absorbs 8 W", correct: true}
    - {label: C, md: "absorbs 92 W"}
    - {label: D, md: "delivers 92 W"}
  solution: |
    **Idea used:** power balance: in any circuit, total power delivered = total power absorbed (see *Power and energy → Power balance*).

    Delivered: 50 W. Absorbed so far: $30 + 12 = 42$ W. The remaining $50 - 42 = 8$ W must be absorbed by element 4.

    **Without a calculator:** $50 - 42 = 8$.

    **Answer: (B) absorbs 8 W.**

- key: ec1-p-010
  topic: ec1-power-energy
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    A house uses five 20 W LED lamps for 6 hours a day. At ₹6 per unit (kWh), the cost of running them for 30 days is
  options:
    - {label: A, md: "₹18"}
    - {label: B, md: "₹54"}
    - {label: C, md: "₹108", correct: true}
    - {label: D, md: "₹180"}
  solution: |
    **Idea used:** energy $= P\times t$; one unit = 1 kWh (see *Power and energy → Energy*).

    Power $= 5\times20 = 100$ W. Energy $= 100\times6\times30 = 18\,000$ Wh $= 18$ kWh. Cost $= 18\times6 = ₹108$.

    Trap: ₹18 is the number of units, not the cost.

    **Without a calculator:** 100 W for 180 h is 18 000 Wh = 18 units; $18\times6 = 108$.

    **Answer: (C) ₹108.**

# ---------- kinds of elements ----------
- key: ec1-p-011
  topic: ec1-kinds-of-elements
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: REVIEWED
  stem: |
    An element (or network) is called linear when it obeys
  options:
    - {label: A, md: "both homogeneity (scaling) and additivity, that is, superposition", correct: true}
    - {label: B, md: "homogeneity only"}
    - {label: C, md: "additivity only"}
    - {label: D, md: "Ohm's law at one fixed temperature only"}
  solution: |
    **Idea used:** linearity (see *Kinds of circuit elements → Linear and non-linear elements*).

    Linear means superposition holds, and superposition is the two properties together: scaling the input scales the output (homogeneity), and the response to a sum is the sum of the responses (additivity). One property alone is not enough. A resistor that obeys Ohm's law is one linear element, but linearity is the wider idea.

    **Answer: (A).**

- key: ec1-p-012
  topic: ec1-kinds-of-elements
  type: MCQ
  nature: THEORY
  difficulty: 2
  status: REVIEWED
  stem: |
    Which one of the following voltage–current relations describes a **linear** element?
  options:
    - {label: A, md: "$v = 2i + 1$"}
    - {label: B, md: "$v = 3i^2$"}
    - {label: C, md: "$v = 4\\,\\dfrac{di}{dt}$", correct: true}
    - {label: D, md: "$v = i\\,|i|$"}
  solution: |
    **Idea used:** test homogeneity: double $i$ and see whether $v$ doubles (see *Kinds of circuit elements*).

    - $v = 2i + 1$: $i \to 2i$ gives $4i + 1 \ne 2(2i + 1)$. Not linear (a straight line that does not pass through the origin).
    - $v = 3i^2$: doubling $i$ makes $v$ four times. Not linear.
    - $v = 4\,di/dt$: doubling $i$ doubles $di/dt$ and so doubles $v$; the derivative of a sum is the sum of derivatives. **Linear.** This is a 4 H inductor.
    - $v = i|i|$: doubling $i$ makes $v$ four times. Not linear.

    **Answer: (C).**

- key: ec1-p-013
  topic: ec1-kinds-of-elements
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: REVIEWED
  stem: |
    Which one of the following is a unilateral element?
  options:
    - {label: A, md: "Resistor"}
    - {label: B, md: "Capacitor"}
    - {label: C, md: "Inductor"}
    - {label: D, md: "Diode", correct: true}
  solution: |
    **Idea used:** bilateral and unilateral elements (see *Kinds of circuit elements*).

    A bilateral element behaves the same for current in either direction; R, L and C are bilateral. A diode conducts easily one way and blocks the other way, so it is unilateral.

    **Answer: (D) Diode.**

- key: ec1-p-014
  topic: ec1-kinds-of-elements
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: REVIEWED
  stem: |
    Which one of the following is an active element?
  options:
    - {label: A, md: "Inductor"}
    - {label: B, md: "Ideal current source", correct: true}
    - {label: C, md: "Capacitor"}
    - {label: D, md: "Resistor"}
  solution: |
    **Idea used:** active and passive elements (see *Kinds of circuit elements → Active and passive elements*).

    An active element can deliver net energy to the circuit for an unlimited time; sources (independent and dependent) are active. R only absorbs energy; L and C store energy and give back only what they took. So R, L and C are passive.

    **Answer: (B) Ideal current source.**

- key: ec1-p-015
  topic: ec1-kinds-of-elements
  type: MCQ
  nature: THEORY
  difficulty: 2
  status: REVIEWED
  stem: |
    An element is called **passive** if
  options:
    - {label: A, md: "the total energy delivered **to** it, up to any time, is never negative", correct: true}
    - {label: B, md: "it never stores energy"}
    - {label: C, md: "its v–i graph is a straight line"}
    - {label: D, md: "it has no resistance"}
  solution: |
    **Idea used:** the energy definition of a passive element (see *Kinds of circuit elements*).

    A passive element can never give out more energy than it has received, so the total energy put into it is $\ge 0$ at every instant. A capacitor stores energy and returns it, but never more than it got, so it is passive; (B) is wrong. Linearity (C) is a different property: a diode is passive but non-linear. (D) is wrong because L and C with no resistance are still passive.

    **Answer: (A).**

- key: ec1-p-016
  topic: ec1-kinds-of-elements
  type: MCQ
  nature: THEORY
  difficulty: 2
  status: REVIEWED
  stem: |
    A resistor whose value changes as $R(t) = 5 + 2\sin t$ Ω (its value does not depend on the current) is
  options:
    - {label: A, md: "linear and time-invariant"}
    - {label: B, md: "linear and time-varying", correct: true}
    - {label: C, md: "non-linear and time-invariant"}
    - {label: D, md: "non-linear and time-varying"}
  solution: |
    **Idea used:** linear vs non-linear and time-invariant vs time-varying are two separate questions (see *Kinds of circuit elements → Other ways to classify elements*).

    - At any instant, $v = R(t)\,i$: doubling $i$ doubles $v$, so it is **linear**.
    - Its value changes with time, so it is **time-varying**.

    **Answer: (B).**

# ---------- the resistor ----------
- key: ec1-p-017
  topic: ec1-resistor
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    A current of 5 mA flows through a 2.2 kΩ resistor. The voltage across it is
  options:
    - {label: A, md: "110 V"}
    - {label: B, md: "1.1 V"}
    - {label: C, md: "0.44 V"}
    - {label: D, md: "11 V", correct: true}
  solution: |
    **Idea used:** Ohm's law $V = IR$ (see *The resistor*).

    $V = 5\times10^{-3}\times2.2\times10^{3} = 11$ V.

    **Without a calculator:** mA × kΩ = V, so $5\times2.2 = 11$ V directly.

    **Answer: (D) 11 V.**

- key: ec1-p-018
  topic: ec1-resistor
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    A wire of resistance 4 Ω is drawn out uniformly so that its length becomes twice the original. Its volume does not change. The new resistance is
  options:
    - {label: A, md: "4 Ω"}
    - {label: B, md: "8 Ω"}
    - {label: C, md: "12 Ω"}
    - {label: D, md: "16 Ω", correct: true}
  solution: |
    **Idea used:** $R = \rho\dfrac{l}{A}$ (see *The resistor → What decides the resistance*).

    Volume $= lA$ is fixed. If $l$ doubles, $A$ halves. Then $R \propto \dfrac{l}{A}$ becomes $\dfrac{2l}{A/2} = 4\dfrac{l}{A}$, so $R$ becomes 4 times: $4\times4 = 16$ Ω.

    Trap: 8 Ω forgets that the area also falls.

    **Without a calculator:** stretching $n$ times at constant volume multiplies $R$ by $n^2$; here $2^2 = 4$.

    **Answer: (D) 16 Ω.**

- key: ec1-p-019
  topic: ec1-resistor
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    A copper coil has a resistance of 20 Ω at 20 °C. Its temperature coefficient of resistance at 20 °C is 0.004 per °C. Its resistance at 70 °C is
  options:
    - {label: A, md: "22 Ω"}
    - {label: B, md: "24 Ω", correct: true}
    - {label: C, md: "25.6 Ω"}
    - {label: D, md: "28 Ω"}
  solution: |
    **Idea used:** $R_2 = R_1\,[1 + \alpha_1(T_2 - T_1)]$ (see *The resistor → Resistance changes with temperature*).

    $R_{70} = 20\,[1 + 0.004\times(70 - 20)] = 20\,(1 + 0.2) = 24$ Ω.

    **Without a calculator:** $0.004\times50 = 0.2$, so the resistance rises by 20 %: $20 + 4 = 24$.

    **Answer: (B) 24 Ω.**

- key: ec1-p-020
  topic: ec1-resistor
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    A lamp is rated 100 W, 200 V. If it is used on a 100 V supply (take its resistance as unchanged), the power it takes is
  options:
    - {label: A, md: "25 W", correct: true}
    - {label: B, md: "50 W"}
    - {label: C, md: "75 W"}
    - {label: D, md: "100 W"}
  solution: |
    **Idea used:** ratings give the resistance, $R = \dfrac{V^2}{P}$; with $R$ fixed, $P \propto V^2$ (see *The resistor → Ratings of lamps and heaters*).

    $R = \dfrac{200^2}{100} = 400$ Ω. At 100 V: $P = \dfrac{100^2}{400} = 25$ W.

    Trap: 50 W assumes power is proportional to voltage.

    **Without a calculator:** half the voltage ⇒ $(1/2)^2 = 1/4$ of the power: $100/4 = 25$ W.

    **Answer: (A) 25 W.**

- key: ec1-p-021
  topic: ec1-resistor
  type: MCQ
  nature: THEORY
  difficulty: 2
  status: REVIEWED
  stem: |
    A 60 W lamp and a 100 W lamp, both rated 220 V, are connected in series across a 220 V supply. Then
  options:
    - {label: A, md: "both glow equally"}
    - {label: B, md: "the 100 W lamp glows brighter"}
    - {label: C, md: "the 60 W lamp glows brighter", correct: true}
    - {label: D, md: "neither lamp glows"}
  solution: |
    **Idea used:** same current in series, so $P = I^2R \propto R$; and $R = V^2/P$, so the lower-rated lamp has the higher resistance (see *The resistor → Ratings of lamps and heaters*).

    $R_{60} = \dfrac{220^2}{60}$ is larger than $R_{100} = \dfrac{220^2}{100}$. In series both carry the same current, so the 60 W lamp takes more power and glows brighter. (Both glow dimmer than normal, but they do glow.)

    **Answer: (C).**

- key: ec1-p-022
  topic: ec1-resistor
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    A current $i = 4\sin\omega t$ A flows through a 5 Ω resistor. The average power taken by the resistor is
  options:
    - {label: A, md: "80 W"}
    - {label: B, md: "56.6 W"}
    - {label: C, md: "20 W"}
    - {label: D, md: "40 W", correct: true}
  solution: |
    **Idea used:** for a sinusoidal current of peak $I_m$, the average power in $R$ is $\dfrac{I_m^2R}{2}$ (see *The resistor → Power when the current changes with time*).

    $P = \dfrac{4^2\times5}{2} = \dfrac{80}{2} = 40$ W.

    Trap: 80 W uses the peak value as if it were DC; the average of $\sin^2$ is $\tfrac12$.

    **Without a calculator:** $16\times5 = 80$, half is 40.

    **Answer: (D) 40 W.**

- key: ec1-p-023
  topic: ec1-resistor
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    A 1 km length of a single-core cable has an insulation resistance (core to sheath) of 600 MΩ. The insulation resistance of 3 km of the same cable is
  options:
    - {label: A, md: "200 MΩ", correct: true}
    - {label: B, md: "600 MΩ"}
    - {label: C, md: "1800 MΩ"}
    - {label: D, md: "67 MΩ"}
  solution: |
    **Idea used:** conductor resistance adds along the length (series), but the insulation paths of each metre are side by side (parallel), so insulation resistance is **inversely** proportional to length (see *The resistor → Conductor resistance and insulation resistance of a cable*).

    Three 1 km lengths give three 600 MΩ paths in parallel: $\dfrac{600}{3} = 200$ MΩ.

    Trap: 1800 MΩ treats insulation like the conductor (series).

    **Without a calculator:** $600 \div 3 = 200$.

    **Answer: (A) 200 MΩ.**

- key: ec1-p-024
  topic: ec1-resistor
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    A non-linear resistor with $V = 2I^2$ (V in volts, I in amperes) is connected in series with a 1 Ω resistor across a 6 V DC supply. The current is
  options:
    - {label: A, md: "1 A"}
    - {label: B, md: "1.5 A", correct: true}
    - {label: C, md: "2 A"}
    - {label: D, md: "3 A"}
  solution: |
    **Idea used:** write KVL with the element law and solve, or test the options (see *The resistor → Non-linear resistors: how to solve*).

    KVL: $6 = 2I^2 + 1\cdot I$ ⇒ $2I^2 + I - 6 = 0$ ⇒ $(2I - 3)(I + 2) = 0$ ⇒ $I = 1.5$ A (the root $-2$ A is rejected: a positive source in a passive loop drives positive current).

    **Without a calculator:** test the options in $2I^2 + I$: $I = 1$: 3; $I = 1.5$: $4.5 + 1.5 = 6$ ✔.

    **Answer: (B) 1.5 A.**

- key: ec1-p-025
  topic: ec1-resistor
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    Three 6 Ω resistors are connected so that two of them are in parallel and this pair is in series with the third. The total resistance is
  options:
    - {label: A, md: "9 Ω", correct: true}
    - {label: B, md: "4 Ω"}
    - {label: C, md: "12 Ω"}
    - {label: D, md: "18 Ω"}
  solution: |
    **Idea used:** series resistances add; $n$ equal resistors in parallel give $R/n$ (see *The resistor → Resistors in series and in parallel*).

    $6 \parallel 6 = 3$ Ω; in series with 6 Ω: $3 + 6 = 9$ Ω.

    **Without a calculator:** two equal in parallel is half: 3, then add 6.

    **Answer: (A) 9 Ω.**

# ---------- the capacitor ----------
- key: ec1-p-026
  topic: ec1-capacitor
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    The voltage across a 5 µF capacitor rises at a steady rate from 0 to 20 V in 4 ms. The current through the capacitor during this time is
  options:
    - {label: A, md: "0.4 mA"}
    - {label: B, md: "2.5 mA"}
    - {label: C, md: "25 mA", correct: true}
    - {label: D, md: "100 mA"}
  solution: |
    **Idea used:** $i = C\dfrac{dv}{dt}$ (see *The capacitor → The current–voltage rule*).

    $\dfrac{dv}{dt} = \dfrac{20}{4\ \text{ms}} = 5$ V/ms $= 5000$ V/s. $i = 5\times10^{-6}\times5000 = 0.025$ A $= 25$ mA.

    **Without a calculator:** µF × (V/ms) = mA, so $5\times5 = 25$ mA.

    **Answer: (C) 25 mA.**

- key: ec1-p-027
  topic: ec1-capacitor
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    An uncharged 6 µF capacitor is charged by a constant current of 3 mA for 4 ms. The voltage across it at the end is
  options:
    - {label: A, md: "8 V"}
    - {label: B, md: "4.5 V"}
    - {label: C, md: "0.5 V"}
    - {label: D, md: "2 V", correct: true}
  solution: |
    **Idea used:** $Q = I\,t$ for a constant current, and $V = Q/C$ (see *The capacitor → Voltage from current*).

    $Q = 3\ \text{mA}\times4\ \text{ms} = 12$ µC. $V = \dfrac{12\ \text{µC}}{6\ \text{µF}} = 2$ V.

    **Without a calculator:** mA × ms = µC and µC ÷ µF = V: $12 \div 6 = 2$.

    **Answer: (D) 2 V.**

- key: ec1-p-028
  topic: ec1-capacitor
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: REVIEWED
  stem: |
    In a DC circuit that has reached steady state, an ideal capacitor behaves as
  options:
    - {label: A, md: "a short circuit"}
    - {label: B, md: "an open circuit", correct: true}
    - {label: C, md: "a resistor"}
    - {label: D, md: "a current source"}
  solution: |
    **Idea used:** $i = C\,dv/dt$ (see *The capacitor*).

    In DC steady state nothing changes, so $dv/dt = 0$ and $i = 0$. A branch with a voltage but no current is an open circuit.

    **Answer: (B) an open circuit.**

- key: ec1-p-029
  topic: ec1-capacitor
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    A 20 µF capacitor is charged to 100 V. The energy stored in it is
  options:
    - {label: A, md: "0.1 J", correct: true}
    - {label: B, md: "0.2 J"}
    - {label: C, md: "1 J"}
    - {label: D, md: "2 mJ"}
  solution: |
    **Idea used:** $W = \tfrac12CV^2$ (see *The capacitor → Energy stored in a capacitor*).

    $W = \tfrac12\times20\times10^{-6}\times100^2 = 10\times10^{-6}\times10^4 = 0.1$ J.

    Trap: 0.2 J forgets the $\tfrac12$.

    **Without a calculator:** $\tfrac12\times20 = 10$ µ; $10\ \text{µ}\times10^4 = 10^{-1}$.

    **Answer: (A) 0.1 J.**

- key: ec1-p-030
  topic: ec1-capacitor
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    An uncharged capacitor is charged from a 50 V DC source through a 10 Ω resistor until charging is complete. The source supplies 25 J in all. The energy finally stored in the capacitor is
  options:
    - {label: A, md: "25 J"}
    - {label: B, md: "it depends on the 10 Ω resistor"}
    - {label: C, md: "12.5 J", correct: true}
    - {label: D, md: "6.25 J"}
  solution: |
    **Idea used:** charging a capacitor from a DC source: the source gives $QV = CV^2$, the capacitor keeps $\tfrac12CV^2$, and the other half is lost as heat in the resistance, whatever its value (see *The capacitor → Charging a capacitor from a DC source*).

    Stored $= \tfrac12\times25 = 12.5$ J. The other 12.5 J heats the 10 Ω resistor. The value of $R$ only changes how fast this happens.

    **Without a calculator:** half of 25.

    **Answer: (C) 12.5 J.**

- key: ec1-p-031
  topic: ec1-capacitor
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    A 4 µF capacitor charged to 60 V is connected across an uncharged 2 µF capacitor. The common voltage after charge sharing is
  options:
    - {label: A, md: "60 V"}
    - {label: B, md: "30 V"}
    - {label: C, md: "20 V"}
    - {label: D, md: "40 V", correct: true}
  solution: |
    **Idea used:** in charge sharing, the total charge stays the same (see *The capacitor → Charge sharing between two capacitors*).

    Charge $= 4\times60 = 240$ µC. Total capacitance $= 4 + 2 = 6$ µF. Common voltage $= \dfrac{240}{6} = 40$ V.

    **Without a calculator:** $V = 60\times\dfrac{4}{4 + 2} = 60\times\dfrac23 = 40$.

    **Answer: (D) 40 V.**

- key: ec1-p-032
  topic: ec1-capacitor
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    Capacitors of 3 µF and 6 µF are connected in series across a 90 V DC supply. The voltage across the 3 µF capacitor is
  options:
    - {label: A, md: "30 V"}
    - {label: B, md: "45 V"}
    - {label: C, md: "60 V", correct: true}
    - {label: D, md: "90 V"}
  solution: |
    **Idea used:** in series, every capacitor has the same charge, so $V \propto \dfrac1C$; the smaller capacitor takes the larger voltage (see *The capacitor → Capacitors in parallel and in series*).

    $C_{eq} = \dfrac{3\times6}{3 + 6} = 2$ µF. $Q = 2\times90 = 180$ µC. $V_3 = \dfrac{180}{3} = 60$ V (and $V_6 = 30$ V).

    **Without a calculator:** split 90 V in the ratio $6:3$ (inverse of C): $90\times\dfrac{6}{9} = 60$.

    **Answer: (C) 60 V.**

- key: ec1-p-033
  topic: ec1-capacitor
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    A 2 µF capacitor and a 4 µF capacitor, each rated 100 V, are connected in series. The largest DC voltage that can safely be applied across the combination is
  options:
    - {label: A, md: "150 V", correct: true}
    - {label: B, md: "200 V"}
    - {label: C, md: "100 V"}
    - {label: D, md: "300 V"}
  solution: |
    **Idea used:** maximum safe voltage of a series group: the voltages split in the ratio $1/C$, so the first capacitor to reach its rating sets the limit (see *The capacitor → Maximum safe voltage of a capacitor group*).

    The 2 µF capacitor takes $\dfrac{4}{2 + 4} = \dfrac23$ of the total. Limit: $\dfrac23V = 100$ ⇒ $V = 150$ V. At 150 V, the 4 µF one has only 50 V, which is safe.

    Trap: 200 V assumes equal sharing.

    **Without a calculator:** 2 µF : 4 µF ⇒ voltages $2:1$; the 2 µF part is 100 V, the 4 µF part 50 V, total 150 V.

    **Answer: (A) 150 V.**

- key: ec1-p-034
  topic: ec1-capacitor
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    The gap between the plates of an air-filled parallel-plate capacitor is halved, and the gap is then completely filled with a dielectric of relative permittivity 3. The capacitance becomes
  options:
    - {label: A, md: "1.5 times"}
    - {label: B, md: "3 times"}
    - {label: C, md: "12 times"}
    - {label: D, md: "6 times", correct: true}
  solution: |
    **Idea used:** $C = \dfrac{\varepsilon_0\varepsilon_rA}{d}$ (see *The capacitor → What a capacitor is*).

    Halving $d$ doubles $C$; $\varepsilon_r = 3$ triples it. Together: $2\times3 = 6$ times.

    **Answer: (D) 6 times.**

- key: ec1-p-035
  topic: ec1-capacitor
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: REVIEWED
  stem: |
    A capacitor has 10 V across it just before a switch is operated at $t = 0$. If no impulse (infinite) current can flow, the voltage across the capacitor just after switching is
  options:
    - {label: A, md: "10 V", correct: true}
    - {label: B, md: "0 V"}
    - {label: C, md: "5 V"}
    - {label: D, md: "it cannot be found without the rest of the circuit"}
  solution: |
    **Idea used:** the capacitor voltage cannot jump (see *The capacitor → The capacitor voltage cannot jump*).

    A sudden jump in $v$ would need $i = C\,dv/dt = \infty$. With no impulse current, $v(0^+) = v(0^-) = 10$ V. The rest of the circuit decides how $v$ changes **after** $t = 0^+$, not its value at that instant.

    **Answer: (A) 10 V.**

# ---------- the inductor ----------
- key: ec1-p-036
  topic: ec1-inductor
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    The current in a 50 mH inductor falls at a steady rate from 4 A to zero in 20 ms. The magnitude of the voltage across the inductor is
  options:
    - {label: A, md: "200 V"}
    - {label: B, md: "10 V", correct: true}
    - {label: C, md: "4 V"}
    - {label: D, md: "1 V"}
  solution: |
    **Idea used:** $v = L\dfrac{di}{dt}$ (see *The inductor → The voltage–current rule*).

    $\dfrac{di}{dt} = \dfrac{4}{20\ \text{ms}} = 200$ A/s. $|v| = 0.05\times200 = 10$ V. (The sign is negative: the inductor opposes the fall.)

    **Without a calculator:** mH × (A/ms) = V: $50\times\dfrac{4}{20} = 50\times0.2 = 10$ V.

    **Answer: (B) 10 V.**

- key: ec1-p-037
  topic: ec1-inductor
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    A constant voltage of 6 V is applied to a 2 H inductor that has no initial current. The current after 3 s is
  options:
    - {label: A, md: "1 A"}
    - {label: B, md: "4 A"}
    - {label: C, md: "9 A", correct: true}
    - {label: D, md: "36 A"}
  solution: |
    **Idea used:** $i(t) = i(0) + \dfrac1L\displaystyle\int_0^t v\,dt$ (see *The inductor → Current from voltage*).

    With constant $v$: $i = \dfrac{vt}{L} = \dfrac{6\times3}{2} = 9$ A. The current rises as a straight line.

    **Without a calculator:** volt-seconds $= 18$; divide by 2 H.

    **Answer: (C) 9 A.**

- key: ec1-p-038
  topic: ec1-inductor
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    A coil has a resistance of 4 Ω and an inductance of 0.5 H. At an instant when its current is 5 A and increasing at 20 A/s, the voltage across its terminals is
  options:
    - {label: A, md: "10 V"}
    - {label: B, md: "20 V"}
    - {label: C, md: "50 V"}
    - {label: D, md: "30 V", correct: true}
  solution: |
    **Idea used:** a real coil is $R$ in series with $L$: $v = Ri + L\dfrac{di}{dt}$ (see *The inductor → A real coil*).

    $v = 4\times5 + 0.5\times20 = 20 + 10 = 30$ V.

    Traps: 20 V (resistive part only), 10 V (inductive part only).

    **Without a calculator:** two small products, then add.

    **Answer: (D) 30 V.**

- key: ec1-p-039
  topic: ec1-inductor
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    An inductor of 0.4 H carries a current of 5 A. The energy stored in its magnetic field is
  options:
    - {label: A, md: "5 J", correct: true}
    - {label: B, md: "10 J"}
    - {label: C, md: "2 J"}
    - {label: D, md: "1 J"}
  solution: |
    **Idea used:** $W = \tfrac12LI^2$ (see *The inductor → Power and energy in an inductor*).

    $W = \tfrac12\times0.4\times25 = 0.2\times25 = 5$ J.

    Trap: 10 J forgets the $\tfrac12$.

    **Without a calculator:** $0.2\times25 = 5$.

    **Answer: (A) 5 J.**

- key: ec1-p-040
  topic: ec1-inductor
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    For a two-terminal element, the voltage stays constant at 10 V while the current rises in a straight line from 0 to 5 A in 2 s. The element is
  options:
    - {label: A, md: "a capacitor of 4 F"}
    - {label: B, md: "an inductor of 4 H", correct: true}
    - {label: C, md: "an inductor of 0.25 H"}
    - {label: D, md: "a resistor of 2 Ω"}
  solution: |
    **Idea used:** identifying an element from its waveforms (see *The inductor → Identifying an element from its waveforms*).

    Constant voltage with a ramping current means $v \propto di/dt$: an inductor. $\dfrac{di}{dt} = \dfrac52 = 2.5$ A/s, so $L = \dfrac{v}{di/dt} = \dfrac{10}{2.5} = 4$ H.

    It cannot be a resistor ($v/i$ is not constant) or a capacitor (a capacitor with constant $v$ carries no current).

    **Without a calculator:** $10 \div 2.5 = 4$.

    **Answer: (B) an inductor of 4 H.**

- key: ec1-p-041
  topic: ec1-inductor
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    Two inductors of 6 mH and 3 mH, with no magnetic coupling between them, are connected in parallel. The equivalent inductance is
  options:
    - {label: A, md: "2 mH", correct: true}
    - {label: B, md: "4.5 mH"}
    - {label: C, md: "9 mH"}
    - {label: D, md: "18 mH"}
  solution: |
    **Idea used:** uncoupled inductors combine like resistors (see *The inductor → Inductors in series and in parallel*).

    $L = \dfrac{6\times3}{6 + 3} = \dfrac{18}{9} = 2$ mH.

    **Without a calculator:** $L$ and $2L$ in parallel give $\tfrac23L$: $\tfrac23\times3 = 2$.

    **Answer: (A) 2 mH.**

- key: ec1-p-042
  topic: ec1-inductor
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    A coil with resistance 2 Ω and inductance 1 H has its current already built up to a steady 3 A. The energy taken by the coil from the supply during the next 10 s (current still 3 A) is
  options:
    - {label: A, md: "4.5 J"}
    - {label: B, md: "180 J", correct: true}
    - {label: C, md: "184.5 J"}
    - {label: D, md: "zero"}
  solution: |
    **Idea used:** energy taken by a real coil = heat in $R$ + change in stored energy $\tfrac12LI^2$ (see *The inductor → Energy taken by a real coil*).

    The current is steady, so the stored energy does not change (it stays $\tfrac12\times1\times9 = 4.5$ J). All the energy taken is heat: $I^2Rt = 9\times2\times10 = 180$ J.

    Trap: 184.5 J adds the stored energy, which was put in **before** these 10 s.

    **Without a calculator:** $9\times2\times10 = 180$.

    **Answer: (B) 180 J.**

- key: ec1-p-043
  topic: ec1-inductor
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: REVIEWED
  stem: |
    In a DC circuit that has reached steady state, an ideal inductor behaves as
  options:
    - {label: A, md: "a short circuit", correct: true}
    - {label: B, md: "an open circuit"}
    - {label: C, md: "a 1 Ω resistor"}
    - {label: D, md: "an ideal current source"}
  solution: |
    **Idea used:** $v = L\,di/dt$ (see *The inductor*).

    In DC steady state the current is constant, so $di/dt = 0$ and $v = 0$. A branch that carries current with zero voltage across it is a short circuit. (The capacitor is the opposite: an open circuit.)

    **Answer: (A) a short circuit.**

- key: ec1-p-044
  topic: ec1-inductor
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: REVIEWED
  stem: |
    By duality, the statement "the voltage across a capacitor cannot change instantly" becomes, for an inductor:
  options:
    - {label: A, md: "the voltage across an inductor cannot change instantly"}
    - {label: B, md: "the current through an inductor cannot change instantly", correct: true}
    - {label: C, md: "the energy of an inductor is $\\tfrac12CV^2$"}
    - {label: D, md: "an inductor is an open circuit at DC"}
  solution: |
    **Idea used:** duality: swap $v \leftrightarrow i$ and $C \leftrightarrow L$ (see *The inductor → Capacitor and inductor side by side*).

    "Capacitor voltage" becomes "inductor current". A jump in inductor current would need $v = L\,di/dt = \infty$, so the inductor current is continuous. The inductor **voltage** can jump.

    **Answer: (B).**

# ---------- mutual inductance ----------
- key: ec1-p-045
  topic: ec1-mutual-inductance
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    Two coils of self-inductance 4 mH and 9 mH have a coefficient of coupling of 0.5. Their mutual inductance is
  options:
    - {label: A, md: "13 mH"}
    - {label: B, md: "6.5 mH"}
    - {label: C, md: "1.5 mH"}
    - {label: D, md: "3 mH", correct: true}
  solution: |
    **Idea used:** $M = k\sqrt{L_1L_2}$ (see *Mutual inductance → How strong is the coupling?*).

    $\sqrt{4\times9} = 6$ mH. $M = 0.5\times6 = 3$ mH.

    **Without a calculator:** $\sqrt{36} = 6$, half is 3.

    **Answer: (D) 3 mH.**

- key: ec1-p-046
  topic: ec1-mutual-inductance
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    Two magnetically coupled coils, $L_1 = 5$ mH and $L_2 = 3$ mH with $M = 2$ mH, are connected in series **opposing**. The total inductance is
  options:
    - {label: A, md: "12 mH"}
    - {label: B, md: "10 mH"}
    - {label: C, md: "4 mH", correct: true}
    - {label: D, md: "6 mH"}
  solution: |
    **Idea used:** two coupled coils in series: $L = L_1 + L_2 \pm 2M$, + for aiding and − for opposing (see *Mutual inductance → Two coupled coils in series*).

    Opposing: $L = 5 + 3 - 2\times2 = 4$ mH. (Aiding would give 12 mH.)

    Trap: 6 mH uses $M$ instead of $2M$.

    **Answer: (C) 4 mH.**

- key: ec1-p-047
  topic: ec1-mutual-inductance
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    Two coupled coils give a total inductance of 16 mH when connected in series aiding and 8 mH when connected in series opposing. The mutual inductance is
  options:
    - {label: A, md: "8 mH"}
    - {label: B, md: "4 mH"}
    - {label: C, md: "12 mH"}
    - {label: D, md: "2 mH", correct: true}
  solution: |
    **Idea used:** $L_a = L_1 + L_2 + 2M$ and $L_o = L_1 + L_2 - 2M$, so $L_a - L_o = 4M$ (see *Mutual inductance → Two coupled coils in series*).

    $M = \dfrac{16 - 8}{4} = 2$ mH.

    Trap: 4 mH divides by 2 instead of 4.

    **Without a calculator:** $8 \div 4 = 2$.

    **Answer: (D) 2 mH.**

- key: ec1-p-048
  topic: ec1-mutual-inductance
  type: MCQ
  nature: THEORY
  difficulty: 2
  status: REVIEWED
  stem: |
    For two magnetically coupled coils marked with the dot convention, a current entering the dotted terminal of coil 1 and increasing induces a voltage in coil 2 that is
  options:
    - {label: A, md: "positive at the dotted terminal of coil 2", correct: true}
    - {label: B, md: "negative at the dotted terminal of coil 2"}
    - {label: C, md: "zero, because the coils are not connected"}
    - {label: D, md: "independent of the mutual inductance"}
  solution: |
    **Idea used:** the dot convention (see *Mutual inductance → The dot convention*).

    The rule: a current entering a dotted terminal induces a mutual voltage $M\,di/dt$ in the other coil with its **+** at that coil's dotted terminal. The coils need no wire between them; the coupling is magnetic, and the voltage is proportional to $M$.

    **Answer: (A).**

# ---------- independent sources ----------
- key: ec1-p-049
  topic: ec1-independent-sources
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: REVIEWED
  stem: |
    The internal resistances of an ideal voltage source and an ideal current source are, respectively,
  options:
    - {label: A, md: "infinite and zero"}
    - {label: B, md: "zero and zero"}
    - {label: C, md: "zero and infinite", correct: true}
    - {label: D, md: "infinite and infinite"}
  solution: |
    **Idea used:** ideal sources (see *Independent sources*).

    An ideal voltage source keeps its terminal voltage whatever the current, so no voltage is lost inside: internal resistance zero (in series). An ideal current source keeps its current whatever the voltage, so no current leaks inside: internal resistance infinite (in parallel).

    **Answer: (C).**

- key: ec1-p-050
  topic: ec1-independent-sources
  type: MCQ
  nature: THEORY
  difficulty: 2
  status: REVIEWED
  stem: |
    Which one of the following connections of ideal sources is **not** allowed?
  options:
    - {label: A, md: "Two 5 V ideal voltage sources in parallel, + to +"}
    - {label: B, md: "A 2 A and a 3 A ideal current source in series", correct: true}
    - {label: C, md: "A 5 V ideal voltage source in series with a 2 A ideal current source"}
    - {label: D, md: "Two 2 A ideal current sources in parallel"}
  solution: |
    **Idea used:** which connections are allowed (see *Independent sources → Which connections are allowed*).

    In series every element must carry the same current, so 2 A and 3 A in series break KCL: not allowed. Equal voltage sources in parallel (A) are allowed (KVL holds). A voltage source in series with a current source (C) is fine: the current source sets the current. Current sources in parallel (D) simply add.

    **Answer: (B).**

- key: ec1-p-051
  topic: ec1-independent-sources
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    A practical voltage source of 12 V with an internal resistance of 3 Ω is replaced by an equivalent practical current source. The current source is
  options:
    - {label: A, md: "36 A in parallel with 3 Ω"}
    - {label: B, md: "4 A in series with 3 Ω"}
    - {label: C, md: "0.25 A in parallel with 3 Ω"}
    - {label: D, md: "4 A in parallel with 3 Ω", correct: true}
  solution: |
    **Idea used:** source transformation: $E$ in series with $r$ ⇔ $I = E/r$ in parallel with the same $r$ (see *Independent sources → Converting one into the other*).

    $I = \dfrac{12}{3} = 4$ A, with 3 Ω in **parallel**.

    **Without a calculator:** $12 \div 3 = 4$.

    **Answer: (D).**

- key: ec1-p-052
  topic: ec1-independent-sources
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: REVIEWED
  stem: |
    A practical source with an internal resistance of 0.5 Ω supplies a load of 50 Ω. With this load, the source behaves nearly as
  options:
    - {label: A, md: "a constant-voltage source", correct: true}
    - {label: B, md: "a constant-current source"}
    - {label: C, md: "both a constant-voltage and a constant-current source"}
    - {label: D, md: "neither"}
  solution: |
    **Idea used:** when does a source behave as constant voltage or constant current (see *Independent sources → When does a source behave as "constant voltage"*).

    If $r \ll R_L$, almost all of the EMF appears across the load and the load voltage hardly changes with the load: constant voltage. Here $r = 0.5$ Ω is 1/100 of 50 Ω. (If $r \gg R_L$ it would act as a constant-current source.)

    **Answer: (A).**

- key: ec1-p-053
  topic: ec1-independent-sources
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    The terminal voltage $v$ and current $i$ of a source are related by $v = 20 - 4i$ (volts, amperes). Its open-circuit voltage and short-circuit current are
  options:
    - {label: A, md: "20 V and 4 A"}
    - {label: B, md: "20 V and 5 A", correct: true}
    - {label: C, md: "5 V and 20 A"}
    - {label: D, md: "4 V and 20 A"}
  solution: |
    **Idea used:** the v–i line of a practical source (see *Independent sources → The v–i graph of a source with a resistor*).

    Open circuit: $i = 0$ ⇒ $v = 20$ V. Short circuit: $v = 0$ ⇒ $4i = 20$ ⇒ $i = 5$ A. (The internal resistance is 4 Ω.)

    Trap: 4 A takes the slope as the current.

    **Without a calculator:** $20 \div 4 = 5$.

    **Answer: (B).**

- key: ec1-p-054
  topic: ec1-independent-sources
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    A 10 V source with an internal resistance of 5 Ω feeds a variable load resistor. The largest power the load can receive is
  options:
    - {label: A, md: "20 W"}
    - {label: B, md: "10 W"}
    - {label: C, md: "5 W", correct: true}
    - {label: D, md: "2.5 W"}
  solution: |
    **Idea used:** maximum power: $R_L = r$ and $P_{max} = \dfrac{E^2}{4r}$ (see *Independent sources → A first word on maximum power*).

    $P_{max} = \dfrac{100}{4\times5} = 5$ W, with $R_L = 5$ Ω (current 1 A, load voltage 5 V).

    Trap: 20 W is $E^2/r$, the short-circuit loss inside the source.

    **Without a calculator:** current $= 10/10 = 1$ A; $1^2\times5 = 5$ W.

    **Answer: (C) 5 W.**

- key: ec1-p-055
  topic: ec1-independent-sources
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    An ideal 2 A current source is connected across a 5 Ω resistor. The voltage across the source and the power it delivers are
  options:
    - {label: A, md: "2.5 V and 5 W"}
    - {label: B, md: "10 V and 20 W", correct: true}
    - {label: C, md: "10 V and 10 W"}
    - {label: D, md: "0.4 V and 0.8 W"}
  solution: |
    **Idea used:** an ideal current source fixes the current; the load decides the voltage (see *Independent sources → The ideal current source*).

    $V = IR = 2\times5 = 10$ V. $P = VI = 10\times2 = 20$ W (also $I^2R = 4\times5 = 20$ W).

    **Without a calculator:** two small products.

    **Answer: (B).**

# ---------- dependent sources ----------
- key: ec1-p-056
  topic: ec1-dependent-sources
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: REVIEWED
  stem: |
    In a voltage-controlled current source, $i = g\,v_x$. The unit of $g$ is
  options:
    - {label: A, md: "ohm"}
    - {label: B, md: "none (a pure number)"}
    - {label: C, md: "volt"}
    - {label: D, md: "siemens", correct: true}
  solution: |
    **Idea used:** the four dependent sources and the units of their gains (see *Dependent sources*).

    $g = \dfrac{i}{v_x}$ is current per volt, the unit of conductance: siemens (it is called transconductance). For comparison: CCVS gain is in ohms; VCVS and CCCS gains have no unit.

    **Answer: (D) siemens.**

- key: ec1-p-057
  topic: ec1-dependent-sources
  type: MCQ
  nature: THEORY
  difficulty: 1
  status: REVIEWED
  stem: |
    Which one of the following statements about dependent (controlled) sources is correct?
  options:
    - {label: A, md: "They are used to model devices such as transistors and op-amps", correct: true}
    - {label: B, md: "They are switched off one at a time when superposition is applied"}
    - {label: C, md: "They can never deliver power"}
    - {label: D, md: "Their value is fixed, whatever happens in the rest of the circuit"}
  solution: |
    **Idea used:** what dependent sources are and the rules that apply to them (see *Dependent sources*).

    - (A) True: amplifier models (transistor, op-amp) are built from dependent sources.
    - (B) False: in superposition only **independent** sources are switched off; dependent sources stay, because their value follows the circuit.
    - (C) False: they are active and often deliver power.
    - (D) False: their value depends on a voltage or current elsewhere in the circuit; that is what "dependent" means.

    **Answer: (A).**

- key: ec1-p-058
  topic: ec1-dependent-sources
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    A current-controlled voltage source has $v = 4\,i_x$ (volts), where $i_x = 2$ A. A current of 3 A enters its **+** terminal. The source
  options:
    - {label: A, md: "absorbs 32 W"}
    - {label: B, md: "delivers 24 W"}
    - {label: C, md: "absorbs 24 W", correct: true}
    - {label: D, md: "absorbs 6 W"}
  solution: |
    **Idea used:** power of a dependent source: use its present voltage and current with the passive sign convention (see *Dependent sources → Power of a dependent source*).

    $v = 4\times2 = 8$ V. The 3 A enters the + terminal, so absorbed power $= +8\times3 = 24$ W: it absorbs 24 W.

    Traps: 6 W multiplies the source current by $i_x$ ($3\times2$) instead of by the source voltage; 32 W multiplies the gain by the voltage ($4\times8$).

    **Without a calculator:** $4\times2 = 8$, $8\times3 = 24$.

    **Answer: (C) absorbs 24 W.**

# ---------- KCL and KVL ----------
- key: ec1-p-059
  topic: ec1-kcl-kvl-first-look
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    Four branches meet at a node. Currents of 5 A and 3 A flow **into** the node in two branches, and 6 A flows **out** in the third. The current in the fourth branch is
  options:
    - {label: A, md: "2 A into the node"}
    - {label: B, md: "8 A out of the node"}
    - {label: C, md: "14 A out of the node"}
    - {label: D, md: "2 A out of the node", correct: true}
  solution: |
    **Idea used:** KCL: total current in = total current out (see *KCL and KVL → Kirchhoff's Current Law*).

    In: $5 + 3 = 8$ A. Out so far: 6 A. So another $8 - 6 = 2$ A must leave through the fourth branch.

    **Without a calculator:** $8 - 6 = 2$, and it leaves, because more is coming in than going out.

    **Answer: (D) 2 A out of the node.**

- key: ec1-p-060
  topic: ec1-kcl-kvl-first-look
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    In a single closed loop, a 24 V source drives a current through three elements in series. The voltage drops across two of them are 10 V and 6 V. The voltage drop across the third element is
  options:
    - {label: A, md: "16 V"}
    - {label: B, md: "40 V"}
    - {label: C, md: "8 V", correct: true}
    - {label: D, md: "4 V"}
  solution: |
    **Idea used:** KVL: around a loop, the sum of the rises equals the sum of the drops (see *KCL and KVL → Kirchhoff's Voltage Law*).

    $24 = 10 + 6 + V_3$ ⇒ $V_3 = 8$ V.

    **Without a calculator:** $24 - 16 = 8$.

    **Answer: (C) 8 V.**

- key: ec1-p-061
  topic: ec1-kcl-kvl-first-look
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    A single loop contains an ideal 10 V voltage source, an ideal 2 A current source and a 3 Ω resistor, all in series. The current through the 3 Ω resistor is
  options:
    - {label: A, md: "3.33 A"}
    - {label: B, md: "2 A", correct: true}
    - {label: C, md: "5.33 A"}
    - {label: D, md: "it cannot be found"}
  solution: |
    **Idea used:** in a series loop, an ideal current source fixes the loop current; the voltage source cannot change it (see *KCL and KVL → Using the laws with ideal sources*).

    The resistor carries the current-source current: 2 A. (The voltage across the current source adjusts itself to satisfy KVL; the 10 V source only changes that voltage.)

    Trap: $10/3 = 3.33$ A ignores the current source.

    **Answer: (B) 2 A.**

- key: ec1-p-062
  topic: ec1-kcl-kvl-first-look
  type: MCQ
  nature: NUMERICAL
  difficulty: 1
  status: REVIEWED
  stem: |
    A 12 V ideal source supplies a 4 Ω resistor and an 8 Ω resistor connected in parallel. The power supplied by the source is
  options:
    - {label: A, md: "54 W", correct: true}
    - {label: B, md: "36 W"}
    - {label: C, md: "18 W"}
    - {label: D, md: "12 W"}
  solution: |
    **Idea used:** power balance: the source supplies the total power absorbed by the resistors (see *KCL and KVL → Power balance*).

    Both resistors have 12 V across them. $P_4 = \dfrac{144}{4} = 36$ W, $P_8 = \dfrac{144}{8} = 18$ W. Total $= 54$ W. (Or: currents 3 A + 1.5 A = 4.5 A, and $12\times4.5 = 54$ W.)

    Trap: 12 W treats the resistors as in series ($144/12$).

    **Without a calculator:** $12\times4.5 = 54$.

    **Answer: (A) 54 W.**

- key: ec1-p-063
  topic: ec1-kcl-kvl-first-look
  type: MCQ
  nature: NUMERICAL
  difficulty: 2
  status: REVIEWED
  stem: |
    In a series R-L-C circuit fed by a source, at one instant the voltages are $v_R = 6$ V, $v_L = 8$ V and $v_C = -2$ V (all measured in the same direction around the loop as the source voltage). The source voltage at that instant is
  options:
    - {label: A, md: "16 V"}
    - {label: B, md: "12 V", correct: true}
    - {label: C, md: "10 V"}
    - {label: D, md: "14 V"}
  solution: |
    **Idea used:** KVL holds at **every instant**, using instantaneous values with their signs (see *KCL and KVL → Kirchhoff's Voltage Law*).

    $v_s = v_R + v_L + v_C = 6 + 8 - 2 = 12$ V.

    Trap: 16 V ignores the minus sign of $v_C$. Phasor (r.m.s.) values do not simply add, but instantaneous values always do.

    **Without a calculator:** $14 - 2 = 12$.

    **Answer: (B) 12 V.**
