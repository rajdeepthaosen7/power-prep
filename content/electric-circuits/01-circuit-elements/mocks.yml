# Chapter-wise mock tests (APSC format: 4-option MCQs, +1 / -0.25, about 72 seconds per question, no calculator).
# The number of questions follows coverage, not a fixed count:
#   pyq   - every Chapter 1 exam question we have (GATE, ESE, APSC), NAT ones asked as MCQs, as APSC does.
#   fresh - only our own questions, at least one for every concept of the chapter.
#   mix   - every concept once; about half exam questions and half our own (different from the fresh mock).
# Order is mixed on purpose, like a real paper. Edit here and re-run content/tools/build_sql.py.

