      3. Around M we have a star: generator arm $0.2$, ground arm $0.35$, infinite-bus arm $0.6$ (line 1 path).
      4. Transfer reactance (generator to infinite bus) $= \dfrac{0.2 \times 0.35 + 0.35 \times 0.6 + 0.6 \times 0.2}{0.35}
