      3. **Routh table:**

         | | | |
         |---|---|---|
         | $s^3$ | 1 | 1 |
         | $s^2$ | $-3$ | 3 |
         | $s^1$ | $\dfrac{(-3)(1) - (1)(3)}{-3} = 2$ | |
         | $s^0$ | 3 | |

         First column: $1, -3, 2, 3$. Two sign changes, so $Z = 2$.
      4. $N = Z - P = 2 - 1 = 1$: **one clockwise** encirclement.

