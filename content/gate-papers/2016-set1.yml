      Loop transfer function of a feedback system is $G(s)H(s) = \dfrac{s + 3}{s^2(s - 3)}$. Take the Nyquist contour in the clockwise
      direction. Then, the Nyquist plot of $G(s)H(s)$ encircles $-1 + j0$
    options:
