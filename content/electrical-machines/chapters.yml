# Electrical Machines (subject slug: electrical-machines) - chapter plan.
# Order: chapters that need no AC phasors first (1-2), then the AC machines (3-9, after Circuits phasors and three-phase).
# Magnetic circuits are listed under EMF in the syllabus; they are taught here (Ch 1) because every machine is built on them,
# and the EMF chapters link back instead of repeating them.
# `topics` are new topics written for this portal (notes + questions).
# `legacy_topics` are the earlier tagging topics (slugs in the DB) that belong to the chapter until it is rewritten.

subject: electrical-machines
chapters:
  - slug: magnetic-basics
    name: Magnetic circuits and transformer basics
    sort: 1
    description: Flux, flux density and permeability; the magnetic circuit and reluctance; B-H curve and hysteresis; induced EMF and inductance; force and energy; the transformer and its EMF equation; core losses; the ideal transformer.
    dir: 01-magnetic-basics
    topics:
      - {slug: em1-magnetic-field, name: "Magnetic field, flux and permeability", note: 01-magnetic-field.md}
      - {slug: em1-magnetic-circuit, name: "The magnetic circuit and reluctance", note: 02-magnetic-circuit.md}
      - {slug: em1-bh-hysteresis, name: "B-H curve, saturation and hysteresis", note: 03-bh-hysteresis.md}
      - {slug: em1-induced-emf, name: "Induced EMF and inductance", note: 04-induced-emf.md}
      - {slug: em1-force-energy, name: "Force, torque and stored energy", note: 05-force-energy.md}
      - {slug: em1-transformer-principle, name: "The transformer: principle and construction", note: 06-transformer-principle.md}
      - {slug: em1-emf-equation, name: "EMF equation of a transformer", note: 07-emf-equation.md}
      - {slug: em1-core-losses, name: "Core losses: hysteresis and eddy current", note: 08-core-losses.md}
      - {slug: em1-ideal-transformer, name: "The ideal transformer", note: 09-ideal-transformer.md}
      - {slug: em1-chapter-summary, name: "Chapter 1 at a glance", note: 10-chapter-summary.md}
    # these earlier topics are fully replaced by the topics above; their questions are re-tagged by the content files
    retire_legacy_topics: [transformers-emf-equation-213, transformers-impedance-referral-291, transformers-magnetizing-self-inductance-353]

